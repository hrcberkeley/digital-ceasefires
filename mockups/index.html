<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- served from /mockups/, but resolve everything (css, js, data, nav links) against the site root -->
<base href="../">
<title>Hero mockups · Digital Ceasefire Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.7.0/papaparse.min.js"></script>
<style>
  .mock-switch {
    position: fixed; left: 50%; bottom: 12px; translate: -50% 0; z-index: 40; max-width: calc(100vw - 24px);
    background: var(--color-ink); color: #fff; border-radius: 12px; padding: 8px 10px 10px; box-shadow: var(--shadow-pop);
    font-size: 0.8rem; line-height: 1.3;
  }
  .mock-switch nav { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; }
  .mock-switch a { color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
  .mock-switch a:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .mock-switch a[aria-current] { background: var(--cover-cream); color: var(--color-ink); font-weight: 700; }
  .mock-switch small { opacity: 0.7; margin-left: 4px; }
  .mock-switch p { margin: 0 0 6px; padding: 0 10px; color: var(--cover-cream); }
  @media (max-width: 768px) { .mock-switch small { display: none; } }</style>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="view" class="view" tabindex="-1">
  <div class="loading" role="status">Loading...</div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<aside class="mock-switch" aria-label="Hero mockups"><p></p><nav></nav></aside>
<script type="module">
  // The real Home view, with its chevron canvas swapped for the chosen mockup.
  import { loadData } from "./js/data.js";
  import { renderHeader, renderFooter } from "./js/layout.js";
  import { renderHome } from "./js/views/home.js";

  const VARIANTS = {
    0: [null, "Current", "live site", "The hero as it is on the site today."],
    1: ["settle", "Settle", "subtle", "Draws in once, then only breathes. The pointer nudges the bands a few pixels."],
    2: ["lantern", "Lantern", "same energy, different feel", "The cover's bands repeat faintly through the navy; a soft light follows the pointer and shows them in colour."],
    3: ["tension", "Tension", "wilder", "Move fast to escalate. Hold still and it de-escalates back to the cover."],
    4: ["dots", "Dot matrix", "experimental", "The cover on an LED grid. The pointer jams the dots; tap sends a pulse through them."],
  };
  const v = VARIANTS[new URLSearchParams(location.search).get("v")] ? new URLSearchParams(location.search).get("v") : "1";
  const [file, , , hint] = VARIANTS[v];

  const sw = document.querySelector(".mock-switch");
  sw.querySelector("p").textContent = hint;
  // ‹ › wrap around (4 → 1), as do the arrow keys
  const keys = Object.keys(VARIANTS), at = keys.indexOf(v);
  const go = (step) => `mockups/index.html?v=${keys[(at + step + keys.length) % keys.length]}`;
  sw.querySelector("nav").innerHTML =
    `<a href="${go(-1)}" aria-label="Previous mockup">‹</a>` +
    Object.entries(VARIANTS).map(([k, [, name, tone]]) =>
      `<a href="mockups/index.html?v=${k}"${k === v ? ' aria-current="page"' : ""}>${k} ${name}<small>${tone}</small></a>`).join("") +
    `<a href="${go(1)}" aria-label="Next mockup">›</a>`;
  const nav = sw.querySelector("nav"), on = nav.querySelector("[aria-current]"); // on phones the row scrolls: show the current one
  nav.scrollLeft = on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2;
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") location.href = go(e.key === "ArrowRight" ? 1 : -1);
  });

  const db = await loadData();
  renderHeader(db);
  renderFooter(db);
  const view = document.getElementById("view");
  view.replaceChildren();
  renderHome({ mountEl: view, db });
  if (file) { // 0 = Current keeps the live chevron
    const current = view.querySelector(".chevron-field");
    const hero = current.parentElement;
    current.remove(); // the live chevron stops itself once its canvas leaves the DOM
    (await import(`./mockups/${file}.js`)).default(hero);
  }
</script>
</body>
</html>
